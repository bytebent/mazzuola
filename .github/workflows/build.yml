name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        # Intel only on every push. Apple Silicon runners often queue 5-10 minutes on
        # free plans; build them on demand with the "apple-silicon" workflow instead.
        include:
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - name: Package app
        run: |
          codesign --force --deep --sign - build/Mazzuola.app
          ditto -c -k --keepParent build/Mazzuola.app Mazzuola-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mazzuola-${{ matrix.arch }}
          path: Mazzuola-${{ matrix.arch }}.zip
          retention-days: 30


  linux:
    # Core tests + scripted UI tests on a virtual screen (Xvfb + Mesa software GL).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11/GL packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev xvfb
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: UI tests (scripted)
        run: tests/ui/run.sh "$PWD/build/Mazzuola" ui-shots
      - name: UI tests at Retina (2x) view scale
        run: MAZZ_VIEW_SCALE=2 tests/ui/run.sh "$PWD/build/Mazzuola"
      - name: UI tests without anti-aliasing (the fallback view buffer)
        run: MAZZ_VIEW_SAMPLES=0 tests/ui/run.sh "$PWD/build/Mazzuola"
      - name: Idle CPU check (control, 1x, 2x)
        run: |
          tests/ui/idle.sh "$PWD/build/Mazzuola" --control
          tests/ui/idle.sh "$PWD/build/Mazzuola"
          MAZZ_VIEW_SCALE=2 tests/ui/idle.sh "$PWD/build/Mazzuola"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots/*.png
          if-no-files-found: ignore
          retention-days: 30

  # Publishes the Mac builds on the repo's Releases page:
  #  - every push to main updates the "latest" pre-release (newest working build)
  #  - a version release (v0.1.0, ...) for each docs/releases/vX.Y.Z.md without one, tagged
  #    at the commit that added that file and published only from a build of the same code
  #    (outside docs/). A later build with other code only warns: re-run the build of the
  #    commit that added the notes. Pushing a vX.Y.Z tag also works.
  release:
    needs: [macos, linux]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release job at a time; a stale run must never replace a newer "latest".
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # history, to find the commit that added each notes file
          filter: blob:none    # commits and trees only, no old file contents
      - uses: actions/download-artifact@v4
        with:
          pattern: Mazzuola-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            notes="docs/releases/${GITHUB_REF_NAME}.md"
            [ -f "$notes" ] || notes="docs/releases/INSTALL.md"
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --title "Mazzuola ${GITHUB_REF_NAME}" --notes-file "$notes" --verify-tag
          else
            # Version releases first, so they don't depend on main not having moved on.
            newest="$(ls docs/releases/v*.md | xargs -n1 basename | sed 's/\.md$//' | sort -V | tail -1)"
            for notes in docs/releases/v*.md; do
              [ -f "$notes" ] || continue
              tag="$(basename "$notes" .md)"
              gh release view "$tag" >/dev/null 2>&1 && continue
              added="$(git log -1 --diff-filter=A --format=%H -- "$notes")"
              if [ -n "$added" ] && { [ "$added" = "${GITHUB_SHA}" ] ||
                   git diff --quiet --no-renames "$added" "${GITHUB_SHA}" -- . ':(exclude)docs'; }; then
                latest=false; [ "$tag" = "$newest" ] && latest=true
                gh release create "$tag" dist/*.zip --target "$added" --latest="$latest" \
                  --title "Mazzuola ${tag}" --notes-file "$notes"
              else
                echo "::warning::${tag} has no release yet. Its notes were added in ${added::7}," \
                  "whose code differs from this build (${GITHUB_SHA::7}), so it is not published" \
                  "from here. Re-run the build of ${added::7} to publish it with that code."
              fi
            done
            # The "latest" pre-release: only from the newest commit on main.
            head="$(git ls-remote origin refs/heads/main | cut -f1)"
            if [ "$head" != "${GITHUB_SHA}" ]; then
              echo "main has moved on (${head::7}); a newer run will publish latest. Skipping."
              exit 0
            fi
            subject="$(git log -1 --format=%s)"
            { echo "Newest working build from \`main\` (${GITHUB_SHA::7}): ${subject}"; echo; cat docs/releases/INSTALL.md; } > latest-notes.md
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest dist/*.zip --prerelease --target "${GITHUB_SHA}" \
              --title "Latest build" --notes-file latest-notes.md
          fi
